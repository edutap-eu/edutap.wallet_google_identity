# The CI calls the same Make targets as a developer does locally. Repeating the
# commands here instead would let the two drift, and that only shows up when CI
# passes something that would have been red on a laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # openid4vci is resolved from a sibling checkout, see pyproject.toml
          submodules: false
      - name: Check out openid4vci next to this package
        uses: actions/checkout@v5
        with:
          repository: edutap-eu/OpenID4VCI
          path: ../OpenID4VCI
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make test-local

  quality:
    name: Linters, type check and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out openid4vci next to this package
        uses: actions/checkout@v5
        with:
          repository: edutap-eu/OpenID4VCI
          path: ../OpenID4VCI
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make lint
      - run: make typecheck
      - run: make docs
      - run: make docs-linkcheck
