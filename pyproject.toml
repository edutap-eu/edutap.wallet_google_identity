[project]
name = "edutap.wallet-google-identity"
dynamic = ["version"]
description = "Google Wallet profile for OpenID for Verifiable Credential Issuance"
keywords = ["Google Wallet", "OpenID4VCI", "Verifiable Credentials", "mdoc", "eduTAP"]
readme = "README.md"
authors = [
    {name = "Alexander Loechel", email = "Alexander.Loechel@lmu.de"},
]
requires-python = ">=3.10"
license = { text = "EUPL 1.2" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    # A pre-release specifier on purpose: 1.0.0a1 is the first published
    # version, and naming it is what allows a pre-release to be resolved
    # at all under PEP 440.
    "openid4vci>=1.0.0a1",
    "pydantic[email]>=2.0",
    "pydantic-settings",
  ]

[project.urls]
Source = "https://github.com/edutap-eu/edutap.wallet_google_identity"
Issues = "https://github.com/edutap-eu/edutap.wallet_google_identity/issues"
Documentation = "https://docs.edutap.eu/packages/edutap_wallet_google_identity/index.html"

[dependency-groups]
test = [
    "pytest",
    "anyio",
]
typecheck = [
    "ty",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-copybutton",
]
develop = [
    "pdbp",  # the maintained successor to pdbpp
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/edutap/wallet_google_identity/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/edutap"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
# generated by hatch-vcs on every build, untracked, not ours to lint
extend-exclude = ["src/edutap/wallet_google_identity/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
no-sections = true
order-by-type = false

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["src", "tests"]

[tool.ty.rules]
unresolved-import = "warn"
# pydantic-settings builds its __init__ dynamically: `_env_file` is a real and
# documented parameter, and a required field may legitimately be omitted when
# the environment supplies it. The type checker cannot see either, so these
# three stay warnings rather than turning correct calls red.
missing-argument = "warn"
unknown-argument = "warn"
invalid-argument-type = "warn"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.codespell]
ignore-words-list = "discreet,"

[tool.check-manifest]
ignore = [
    ".editorconfig",
    ".pre-commit-config.yaml",
    "src/edutap/wallet_google_identity/_version.py",
]

[tool.tox]
min_version = "4.4.0"
env_list = ["py310", "py311", "py312", "py313", "lint"]

[tool.tox.gh.python]
"3.10" = ["py310"]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]

[tool.tox.env_run_base]
description = "run tests"
use_develop = true
skip_install = false
commands = [["pytest", { replace = "posargs", extend = true }]]
dependency_groups = ["test", "develop"]

[tool.tox.env.format]
description = "automatically reformats code"
skip_install = true
deps = ["pre-commit"]
commands = [
    ["pre-commit", "run", "-a", "ruff"],
    ["pre-commit", "run", "-a", "ruff-format"],
]

[tool.tox.env.lint]
description = "run linters that will help improve the code style"
skip_install = true
deps = ["pre-commit"]
commands = [["pre-commit", "run", "-a"]]
